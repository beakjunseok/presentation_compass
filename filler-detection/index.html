<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>필러워드 탐지 데모 — Presentation Compass</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  main { padding-bottom: 3rem; }
  h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
  .page-lead { color: var(--text-muted); margin-top: 0; margin-bottom: 2rem; }
  h2.step { font-size: 1.05rem; margin: 2.2rem 0 0.8rem; }
  .summary { padding: 1rem; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 1.2rem; }
  .summary.fail { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .gemini-note { background: color-mix(in srgb, var(--brand) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.2rem; font-size: 0.9rem; color: var(--text-muted); }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  th { background: var(--surface-2); }
  .case-title { font-weight: bold; margin-top: 1.5rem; }
  .desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); font-weight: bold; }
  .skip { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="site-nav">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="2.5" fill="currentColor"/>
        <path d="M31 17L21 21L17 31L27 27L31 17Z" fill="var(--accent)" stroke="var(--accent)" stroke-linejoin="round"/>
      </svg>
      Presentation Compass
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">🌙</button>
  </nav>

  <main>
  <h1 style="margin-top:2.2rem;">한국어 필러워드 탐지 로직 검증</h1>
  <p class="page-lead">규칙 기반 탐지와 Gemini 문맥 판정을 같은 테스트셋으로 비교하는 내부 검증 페이지입니다.</p>

  <h2 class="step">1단계 — 규칙 기반(정규식+사전)</h2>
  <div id="summary-rule" class="summary">채점 중...</div>
  <div id="results-rule"></div>

  <h2 class="step">2단계 — Gemini 문맥 판정</h2>
  <div class="gemini-note">Gemini 호출은 서버(/api/detect-fillers)를 통해 이루어집니다. API 키는 Vercel 환경변수(GEMINI_API_KEY)로만 보관되며 브라우저에는 절대 노출되지 않습니다. 배포된 사이트에서만 동작합니다.
    <div style="margin-top:0.7rem;">
      <button class="btn" id="runGemini" type="button">Gemini로 검증 실행</button>
    </div>
  </div>
  <div id="summary-gemini" class="summary" style="display:none;"></div>
  <div id="results-gemini"></div>
  </main>
</div>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");
  const stored = localStorage.getItem("pc-theme");
  if (stored) root.setAttribute("data-theme", stored);
  const isDark = () => (root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  const syncToggle = () => { toggle.textContent = isDark() ? "☀️" : "🌙"; };
  syncToggle();
  toggle.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("pc-theme", next);
    syncToggle();
  });
</script>

<script type="module">
import { detectFillers } from "./filler-detector.mjs";
import { classifyWithGemini } from "./gemini-client.mjs";
import { cases } from "./test-cases.mjs";

function renderCases(containerEl, summaryEl, labelPrefix, resultsByCase) {
  containerEl.innerHTML = "";
  let total = 0, correct = 0;

  for (const { c, output } of resultsByCase) {
    const rows = output.map((tok, i) => {
      const expected = c.tokens[i].expected;
      let verdict = "skip";
      if (expected !== null) {
        total++;
        const isRight = tok.isFiller === expected;
        if (isRight) correct++;
        verdict = isRight ? "ok" : "bad";
      }
      return { word: tok.word, isFiller: tok.isFiller, reason: tok.reason, expected, verdict };
    });

    const block = document.createElement("div");
    block.innerHTML = `
      <div class="case-title">${c.id}</div>
      <div class="desc">${c.desc}</div>
      <table>
        <tr><th>단어</th><th>예측</th><th>기대값</th><th>근거</th><th>판정</th></tr>
        ${rows.map(r => `
          <tr>
            <td>${r.word}</td>
            <td>${r.isFiller ? "필러" : "정상"}</td>
            <td>${r.expected === null ? "-" : (r.expected ? "필러" : "정상")}</td>
            <td>${r.reason}</td>
            <td class="${r.verdict}">${r.verdict === "ok" ? "✓" : r.verdict === "bad" ? "✗ 오답" : "-"}</td>
          </tr>`).join("")}
      </table>
    `;
    containerEl.appendChild(block);
  }

  const acc = total ? ((correct / total) * 100).toFixed(1) : "N/A";
  summaryEl.style.display = "block";
  summaryEl.textContent = `${labelPrefix} — 채점 대상 ${total}개 중 ${correct}개 정답 (정확도 ${acc}%)`;
  summaryEl.classList.toggle("fail", correct !== total);
}

// 1단계: 규칙 기반 (즉시 실행)
const ruleResults = cases.map((c) => ({ c, output: detectFillers(c.tokens) }));
renderCases(document.getElementById("results-rule"), document.getElementById("summary-rule"), "규칙 기반", ruleResults);

// 2단계: Gemini (버튼 클릭 시 실행, /api/detect-fillers 프록시 경유)
document.getElementById("runGemini").addEventListener("click", async () => {
  const summaryEl = document.getElementById("summary-gemini");
  summaryEl.style.display = "block";
  summaryEl.classList.remove("fail");
  summaryEl.textContent = "Gemini 호출 중...";

  try {
    const geminiResults = [];
    for (const c of cases) {
      const output = await classifyWithGemini(c.tokens);
      geminiResults.push({ c, output });
    }
    renderCases(document.getElementById("results-gemini"), summaryEl, "Gemini", geminiResults);
  } catch (err) {
    summaryEl.textContent = "오류: " + err.message + " (로컬 정적 서버가 아닌 Vercel 배포 환경에서만 동작합니다)";
    summaryEl.classList.add("fail");
  }
});
</script>
</body>
</html>
